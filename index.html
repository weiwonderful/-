<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 - Snake Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    color: #eee;
    user-select: none;
  }
  h1 {
    font-size: 2.2rem;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #00d4ff, #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
  }
  .info-bar {
    display: flex;
    gap: 30px;
    margin-bottom: 15px;
    font-size: 1.1rem;
  }
  .info-bar span { color: #00ff88; font-weight: bold; }
  .game-container {
    position: relative;
    border: 3px solid #00d4ff;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #0a0a1a;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    backdrop-filter: blur(4px);
  }
  .overlay.hidden { display: none; }
  .overlay h2 {
    font-size: 2rem;
    color: #ff4757;
  }
  .overlay p { font-size: 1.2rem; color: #ccc; }
  .overlay .score-final { color: #00ff88; font-size: 1.5rem; font-weight: bold; }
  button {
    padding: 12px 36px;
    font-size: 1.1rem;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, #00d4ff, #00ff88);
    color: #0a0a1a;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
  }
  button:active { transform: scale(0.97); }
  .controls-hint {
    margin-top: 15px;
    font-size: 0.9rem;
    color: #888;
    text-align: center;
    line-height: 1.8;
  }
  .controls-hint kbd {
    background: #2a2a4a;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid #444;
    font-family: monospace;
    color: #00d4ff;
  }
  /* 移动端虚拟方向键 */
  .mobile-controls {
    display: none;
    margin-top: 20px;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 8px;
  }
  .mobile-controls button {
    padding: 0;
    font-size: 1.5rem;
    border-radius: 10px;
    background: rgba(0, 212, 255, 0.2);
    color: #00d4ff;
    border: 2px solid #00d4ff;
  }
  .mobile-controls .up { grid-column: 2; grid-row: 1; }
  .mobile-controls .left { grid-column: 1; grid-row: 2; }
  .mobile-controls .down { grid-column: 2; grid-row: 3; }
  .mobile-controls .right { grid-column: 3; grid-row: 2; }
  @media (max-width: 600px) {
    .mobile-controls { display: grid; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<h1>🐍 贪吃蛇</h1>

<div class="info-bar">
  <div>得分: <span id="score">0</span></div>
  <div>最高分: <span id="highScore">0</span></div>
  <div>速度: <span id="speedLevel">1</span></div>
</div>

<div class="game-container">
  <canvas id="game" width="400" height="400"></canvas>
  <div class="overlay" id="startOverlay">
    <h2 style="color:#00d4ff;">准备开始</h2>
    <p>吃掉食物，不断成长！</p>
    <button onclick="startGame()">开始游戏</button>
  </div>
  <div class="overlay hidden" id="gameOverOverlay">
    <h2>游戏结束</h2>
    <p>本局得分: <span class="score-final" id="finalScore">0</span></p>
    <p id="newRecord" style="color:#ffd700; display:none;">🏆 新纪录！</p>
    <button onclick="startGame()">再来一局</button>
  </div>
</div>

<div class="controls-hint">
  <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 控制方向
  &nbsp;|&nbsp; <kbd>空格</kbd> 暂停/继续
</div>

<div class="mobile-controls">
  <button class="up" ontouchstart="setDir(0,-1)" onclick="setDir(0,-1)">▲</button>
  <button class="left" ontouchstart="setDir(-1,0)" onclick="setDir(-1,0)">◀</button>
  <button class="down" ontouchstart="setDir(0,1)" onclick="setDir(0,1)">▼</button>
  <button class="right" ontouchstart="setDir(1,0)" onclick="setDir(1,0)">▶</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake, dir, nextDir, food, score, highScore, speed, gameLoop, paused, running;

highScore = parseInt(localStorage.getItem('snakeHighScore') || '0');
document.getElementById('highScore').textContent = highScore;

function init() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  speed = 150;
  paused = false;
  placeFood();
  updateUI();
}

function placeFood() {
  while (true) {
    food = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
    if (!snake.some(s => s.x === food.x && s.y === food.y)) break;
  }
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('highScore').textContent = highScore;
  document.getElementById('speedLevel').textContent = Math.floor((150 - speed) / 10) + 1;
}

function setDir(x, y) {
  if (!running || paused) return;
  // 禁止反向
  if (dir.x + x === 0 && dir.y + y === 0) return;
  nextDir = {x, y};
}

function startGame() {
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('gameOverOverlay').classList.add('hidden');
  init();
  running = true;
  clearInterval(gameLoop);
  gameLoop = setInterval(tick, speed);
}

function tick() {
  if (paused) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // 撞墙
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    return gameOver();
  }
  // 撞自己
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHighScore', highScore);
    }
    // 加速
    if (speed > 60 && score % 50 === 0) {
      speed -= 10;
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
    }
    placeFood();
    updateUI();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  // 背景网格
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(0, 212, 255, 0.05)';
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * GRID, 0);
    ctx.lineTo(i * GRID, canvas.height);
    ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath();
    ctx.moveTo(0, i * GRID);
    ctx.lineTo(canvas.width, i * GRID);
    ctx.stroke();
  }

  // 食物（发光苹果）
  const fx = food.x * GRID + GRID / 2;
  const fy = food.y * GRID + GRID / 2;
  const gradient = ctx.createRadialGradient(fx, fy, 2, fx, fy, GRID);
  gradient.addColorStop(0, '#ff6b6b');
  gradient.addColorStop(1, 'rgba(255, 71, 87, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(food.x * GRID - 5, food.y * GRID - 5, GRID + 10, GRID + 10);
  ctx.fillStyle = '#ff4757';
  ctx.beginPath();
  ctx.arc(fx, fy, GRID / 2 - 3, 0, Math.PI * 2);
  ctx.fill();

  // 蛇
  snake.forEach((seg, i) => {
    const t = i / snake.length;
    if (i === 0) {
      // 蛇头
      ctx.fillStyle = '#00ff88';
      ctx.shadowColor = '#00ff88';
      ctx.shadowBlur = 15;
    } else {
      ctx.fillStyle = `hsl(${160 - t * 40}, 100%, ${55 - t * 20}%)`;
      ctx.shadowBlur = 0;
    }
    ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
    ctx.shadowBlur = 0;

    // 蛇头眼睛
    if (i === 0) {
      ctx.fillStyle = '#0a0a1a';
      const ex = seg.x * GRID + GRID / 2;
      const ey = seg.y * GRID + GRID / 2;
      const off = 4;
      if (dir.x === 1) {
        ctx.fillRect(ex + 2, ey - off, 3, 3);
        ctx.fillRect(ex + 2, ey + off - 3, 3, 3);
      } else if (dir.x === -1) {
        ctx.fillRect(ex - 5, ey - off, 3, 3);
        ctx.fillRect(ex - 5, ey + off - 3, 3, 3);
      } else if (dir.y === -1) {
        ctx.fillRect(ex - off, ey - 5, 3, 3);
        ctx.fillRect(ex + off - 3, ey - 5, 3, 3);
      } else {
        ctx.fillRect(ex - off, ey + 2, 3, 3);
        ctx.fillRect(ex + off - 3, ey + 2, 3, 3);
      }
    }
  });
}

function gameOver() {
  running = false;
  clearInterval(gameLoop);
  document.getElementById('finalScore').textContent = score;
  const isNewRecord = score > 0 && score >= highScore;
  document.getElementById('newRecord').style.display = isNewRecord ? 'block' : 'none';
  document.getElementById('gameOverOverlay').classList.remove('hidden');
}

// 键盘控制
document.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowUp': case 'w': case 'W': setDir(0, -1); e.preventDefault(); break;
    case 'ArrowDown': case 's': case 'S': setDir(0, 1); e.preventDefault(); break;
    case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); e.preventDefault(); break;
    case 'ArrowRight': case 'd': case 'D': setDir(1, 0); e.preventDefault(); break;
    case ' ':
      if (running) {
        paused = !paused;
        if (paused) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#00d4ff';
          ctx.font = 'bold 32px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('已暂停', canvas.width / 2, canvas.height / 2);
        }
      }
      e.preventDefault();
      break;
  }
});

// 初始绘制
init();
draw();
</script>

</body>
</html>
